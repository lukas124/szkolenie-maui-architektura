# CI w Azure DevOps: wszystkie testy (także architektury) + build Android przy każdym pushu na develop i main i przy pull requeście do nich.
# (W Azure Repos wyzwalacz pull requestów ustawia się zasadą gałęzi „Build validation”; w GitHub działa sekcja pr.)
trigger:
  branches:
    include: [develop, main]

pr:
  branches:
    include: [develop, main]

# Maszyna z Linuxem od Microsoftu (hosted agent); Android SDK i JDK są już zainstalowane
pool:
  vmImage: ubuntu-latest

jobs:
  # Testy jednostkowe i architektury (bez emulatora i bez workloadu MAUI)
  - job: Test
    displayName: Testy (dotnet test)
    steps:
      - template: templates/setup-dotnet.yml

      # Wszystkie projekty testowe; wyniki trafiają do zakładki „Tests” w uruchomieniu pipeline'u
      - task: DotNetCoreCLI@2
        displayName: dotnet test
        inputs:
          command: test
          projects: tests/*.Tests/*.Tests.csproj
          arguments: -c Release
          publishTestResults: true

  # Build aplikacji Android (Release), bez podpisu sklepowego
  - job: BuildAndroid
    displayName: Build Android
    steps:
      - template: templates/setup-dotnet.yml
        parameters:
          workload: android

      - bash: dotnet build src/FieldService.UI/FieldService.UI.csproj -f net10.0-android -c Release
        displayName: dotnet build (Android, Release)
