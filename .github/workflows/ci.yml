# CI (Continuous Integration): przy każdym pushu na develop i main i przy każdym pull requeście do nich sprawdzamy, czy kod
# się buduje i czy testy przechodzą – także testy architektury (reguła zależności, „tylko UI zna MAUI”, granice modułów).
# Czerwony test = zatrzymana taśma. Nic nie jest podpisywane ani publikowane – to „bramka jakości” przed scaleniem zmian.
name: CI

on:
  push:            # każdy push na develop i main (gitflow: develop = bieżąca praca, main = wydania)
    branches: [develop, main]
  pull_request:    # każdy pull request do develop (feature/*) i do main (release/*, hotfix/*)
    branches: [develop, main]
  workflow_dispatch: # ręczne uruchomienie z zakładki Actions

jobs:
  # Wszystkie projekty testowe (net10.0) – nie potrzebują emulatora ani workloadu MAUI
  test:
    name: Testy (dotnet test)
    runs-on: ubuntu-latest
    steps:
      # Pobranie kodu repozytorium
      - uses: actions/checkout@v7

      # Instalacja .NET SDK w wersji z global.json
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Testy domeny, przypadków użycia, adapterów, prezentacji i architektury, wyniki w formacie TRX
      - name: dotnet test
        run: |
          for project in tests/*.Tests/*.Tests.csproj; do
            dotnet test "$project" -c Release --logger "trx;LogFilePrefix=$(basename "$project" .csproj)" --results-directory TestResults
          done

      # Wyniki testów do pobrania z podsumowania uruchomienia (także gdy testy nie przeszły)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  # Build aplikacji na Androida (Release) – sprawdza XAML (compiled bindings), zasoby, manifest i przycinanie
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Android SDK jest już na maszynie GitHub, a .NET for Android wymaga JDK 17
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Workload MAUI dla Androida (na Linuxie projekt UI ma tylko target net10.0-android)
      - name: Instalacja workloadu maui-android
        run: dotnet workload install maui-android

      # Build Release. W CI nie podpisujemy (APK podpisany kluczem debug wystarcza do sprawdzenia buildu)
      - name: dotnet build (Android, Release)
        run: dotnet build src/FieldService.UI/FieldService.UI.csproj -f net10.0-android -c Release
